<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>File Drop — 파일 공유</title>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #141b24;
      --panel2: #1b2430;
      --line: #2a3544;
      --text: #e8eef6;
      --muted: #8b9bb0;
      --accent: #5eead4;
      --accent2: #38bdf8;
      --danger: #fb7185;
      --ok: #34d399;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", "Noto Sans KR", ui-sans-serif, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, #123 0%, transparent 50%),
        radial-gradient(800px 500px at 100% 0%, #0a2a28 0%, transparent 45%),
        var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 28px 24px 8px;
      max-width: 720px;
      margin: 0 auto;
      width: 100%;
    }
    h1 {
      font-size: 28px;
      letter-spacing: -0.03em;
      font-weight: 750;
    }
    h1 span { color: var(--accent); }
    .sub { color: var(--muted); margin-top: 6px; font-size: 14px; }
    main {
      flex: 1;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px;
    }
    .drop {
      border: 1.5px dashed var(--line);
      background: linear-gradient(180deg, var(--panel), var(--panel2));
      border-radius: 20px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, transform .15s, box-shadow .2s;
    }
    .drop:hover, .drop.over {
      border-color: var(--accent);
      box-shadow: 0 0 0 6px rgba(94, 234, 212, .08);
      transform: translateY(-1px);
    }
    .drop strong { display: block; font-size: 18px; margin-bottom: 8px; }
    .drop p { color: var(--muted); font-size: 13px; }
    input[type=file] { display: none; }
    .card {
      margin-top: 20px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 20px;
    }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .name { font-weight: 650; word-break: break-all; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 6px; }
    .btn {
      appearance: none;
      border: 0;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      color: #04221d;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn.ghost {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--line);
    }
    .linkbox {
      margin-top: 12px;
      display: flex;
      gap: 8px;
    }
    .linkbox input {
      flex: 1;
      background: #0d131a;
      border: 1px solid var(--line);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 13px;
    }
    .err { color: var(--danger); margin-top: 12px; font-size: 14px; }
    .ok { color: var(--ok); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 12px;
      padding: 24px;
    }
    progress {
      width: 100%;
      margin-top: 14px;
      height: 8px;
      accent-color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <h1>File <span>Drop</span></h1>
    <p class="sub">파일을 올리면 바로 공유 링크가 생깁니다. 최대 50MB.</p>
  </header>
  <main>
    <div id="uploader">
      <div class="drop" id="drop">
        <strong>여기에 파일을 놓거나 클릭해서 선택</strong>
        <p>업로드 후 링크를 복사해 공유하세요</p>
      </div>
      <input type="file" id="file" />
      <progress id="bar" hidden value="0" max="100"></progress>
      <p class="err" id="err"></p>
    </div>
    <div class="card" id="result" hidden></div>
  </main>
  <footer>로컬 프로토타입 · 링크를 아는 사람만 다운로드할 수 있습니다</footer>
  <script>
    const drop = document.getElementById("drop");
    const input = document.getElementById("file");
    const err = document.getElementById("err");
    const bar = document.getElementById("bar");
    const result = document.getElementById("result");
    const uploader = document.getElementById("uploader");

    const path = location.pathname;
    const shareMatch = path.match(/^\/s\/([A-Za-z0-9]+)$/);

    function fmt(n) {
      if (n < 1024) return n + " B";
      if (n < 1024 ** 2) return (n / 1024).toFixed(1) + " KB";
      return (n / 1024 ** 2).toFixed(1) + " MB";
    }

    function showShare(info, origin) {
      const url = origin + "/s/" + info.id;
      result.hidden = false;
      result.innerHTML = `
        <div class="row">
          <div>
            <div class="name">${escapeHtml(info.filename)}</div>
            <div class="meta">${fmt(info.size)} · ID ${info.id}</div>
          </div>
        </div>
        <div class="linkbox">
          <input id="shareurl" readonly value="${url}" />
          <button class="btn" id="copy">복사</button>
          <a class="btn ghost" href="/api/download/${info.id}">다운로드</a>
        </div>
      `;
      document.getElementById("copy").onclick = async () => {
        await navigator.clipboard.writeText(url);
        document.getElementById("copy").textContent = "복사됨";
      };
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    async function loadShare(id) {
      uploader.hidden = true;
      const res = await fetch("/api/info/" + id);
      if (!res.ok) {
        result.hidden = false;
        result.innerHTML = `<p class="err">파일을 찾을 수 없습니다.</p>`;
        return;
      }
      const info = await res.json();
      showShare(info, location.origin);
    }

    function upload(file) {
      err.textContent = "";
      if (file.size > 50 * 1024 * 1024) {
        err.textContent = "50MB를 초과합니다.";
        return;
      }
      const fd = new FormData();
      fd.append("file", file);
      bar.hidden = false;
      bar.value = 30;
      fetch("/api/upload", { method: "POST", body: fd })
        .then(async r => {
          bar.value = 90;
          if (!r.ok) throw new Error((await r.json()).detail || "업로드 실패");
          return r.json();
        })
        .then(info => {
          bar.value = 100;
          history.replaceState({}, "", "/s/" + info.id);
          showShare(info, location.origin);
        })
        .catch(e => { err.textContent = e.message; })
        .finally(() => { setTimeout(() => bar.hidden = true, 400); });
    }

    drop.addEventListener("click", () => input.click());
    drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
    drop.addEventListener("dragleave", () => drop.classList.remove("over"));
    drop.addEventListener("drop", e => {
      e.preventDefault();
      drop.classList.remove("over");
      if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
    });
    input.addEventListener("change", () => { if (input.files[0]) upload(input.files[0]); });

    if (shareMatch) loadShare(shareMatch[1]);
  </script>
</body>
</html>
